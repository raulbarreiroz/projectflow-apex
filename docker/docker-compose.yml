name: ${COMPOSE_PROJECT_NAME:-docker-apex}

services:
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: oracle-xe
    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD:-oracle}
      ORACLE_CHARACTERSET: ${ORACLE_CHARACTERSET:-AL32UTF8}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
      - "${ORACLE_EM_PORT:-5500}:5500"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - oracle_setup:/opt/oracle/scripts/setup
    shm_size: 2gb
    mem_limit: 4gb
    memswap_limit: 4gb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/$${ORACLE_PWD}@localhost:1521/XEPDB1 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - apex_network

  apex:
    build:
      context: ..
      dockerfile: Dockerfile.apex
    container_name: apex-server
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle}
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: ${DB_SERVICE:-XEPDB1}
      DB_ROOT_SERVICE: ${DB_ROOT_SERVICE:-XE}
      ORDS_CONFIG_DIR: /opt/ords/config
      APEX_IMAGES: /opt/apex/images
      APEX_ADMIN_USER: ${APEX_ADMIN_USER:-ADMIN}
      APEX_ADMIN_EMAIL: ${APEX_ADMIN_EMAIL:-admin@localhost}
      APEX_ADMIN_PASSWORD: ${APEX_ADMIN_PASSWORD:-Welcome1!}
      APEX_PUBLIC_PASSWORD: ${APEX_PUBLIC_PASSWORD:-Welcome1!}
      ORDS_PUBLIC_PASSWORD: ${ORDS_PUBLIC_PASSWORD:-Welcome1!}
    ports:
      - "${APEX_PORT:-8081}:8080"
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - apex_network
    volumes:
      - apex_config:/opt/ords/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ords/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  oracle_data:
  oracle_setup:
  apex_config:

networks:
  apex_network:
    driver: bridge
